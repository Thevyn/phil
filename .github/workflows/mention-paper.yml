name: Mention paper trading

# Hourly forward test of the mention-market model (mention/paper.py):
# forecast events starting within 24h, settle finished ones, commit the journal.
# Transcripts live only in the Actions cache, never in the repo.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # failure alert below

concurrency:
  group: mention-paper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: mention/.cache
          key: mention-cache-${{ github.run_id }}
          restore-keys: mention-cache-
      - name: Self-checks
        run: |
          python3 -m mention.rules
          python3 -m mention.model
          python3 -m mention.events
          python3 -m mention.paper demo
      - name: Settle and forecast
        run: python3 -m mention.paper run
      - name: Scoreboard
        if: always()
        run: python3 -m mention.paper report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit journal
        if: always()  # a crash mid-run must not lose rows already appended
        run: |
          git add mention/journal
          if git diff --cached --quiet; then echo "no journal changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" \
            commit -m "mention: paper tick $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push
      # Alert: one open issue while ticks fail (GitHub notifies the owner), closed on the next green tick.
      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --state open --search "in:title Mention paper tick failing" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $url"
          else gh issue create --title "Mention paper tick failing" --body "Tick failed: $url"; fi
      - name: Close alert issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search "in:title Mention paper tick failing" --json number -q '.[].number'); do
            gh issue close "$n" --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
